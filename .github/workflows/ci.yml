name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest — isolated tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mtc_ci
          POSTGRES_PASSWORD: mtc_ci_password
          POSTGRES_DB: mtc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -e .
          fi
          pip install pytest pytest-asyncio
          pip list

      # Postgres service container above gives the real-DB tests a
      # live database. Migrations run once before the test split below.
      #
      # Tests are split into two steps by dependency:
      #   no-DB:   test_secret_validation.py, test_mpesa_callback.py
      #   real-DB: test_auth.py, test_dispatch.py, test_flags_vouchers.py,
      #            test_ledger.py, test_requests.py
      #
      # Staff credentials are read from env vars by
      # mtc.auth.staff.authenticate (not from a DB table). The bcrypt
      # hashes below are for public test PINs and have no secrecy value;
      # they were generated fresh for CI, not copied from any .env file.
      # Plaintext PINs are documented in the comments so readers can
      # verify.
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL_MAIN: "postgresql://mtc_ci:mtc_ci_password@localhost:5432/mtc_ci"
        run: alembic upgrade head

      - name: Test (no-DB)
        working-directory: backend
        env:
          PYTHONPATH: src
          CI_NO_DB: "1"
        run: pytest tests/test_secret_validation.py tests/test_mpesa_callback.py tests/test_pay_route.py -v

      - name: Test (real DB)
        working-directory: backend
        env:
          PYTHONPATH: src
          ENVIRONMENT: development
          DATABASE_URL_MAIN: "postgresql://mtc_ci:mtc_ci_password@localhost:5432/mtc_ci"
          # Required secrets — dummy CI values, 32+ chars, no real-world use
          JWT_SECRET: "ci-dummy-jwt-secret-not-for-production-0000"
          LEDGER_HMAC_KEY: "ci-dummy-ledger-hmac-key-not-for-prod-0000"
          TOKEN_HMAC_KEY_CURRENT: "ci-dummy-token-hmac-key-not-for-prod-0000"
          PARTNER_HMAC_KEY: "ci-dummy-partner-hmac-key-not-for-prod-000"
          # ENROL-04 bcrypt('4821')
          STAFF_ENROL_ID: ENROL-04
          STAFF_ENROL_PIN_HASH: "$2b$12$8HFMUTxWJ/f.HdEB5WY9C.YaGuNWjxAefDWhR.UAmeklNDCoxpWhO"
          # FULF-08 bcrypt('7355')
          STAFF_FULF_ID: FULF-08
          STAFF_FULF_PIN_HASH: "$2b$12$SC7SZ7Le48uTOwfAYWpPxu/YSIhgjodpa5eIxEFz7Q0.vGovVWFZa"
          # AUDIT-02 bcrypt('9142')
          STAFF_AUDIT_ID: AUDIT-02
          STAFF_AUDIT_PIN_HASH: "$2b$12$WUnfFZS4BgXKEYyacQ.aZ.q82qZUxOu9O9UAYpv7aCY4a/2ZZv.iC"
          # Mock integrations, matching local .env, so no real HTTP calls fire
          MOCK_SMS: "true"
          MOCK_MPESA: "true"
          MOCK_LOCKER: "true"
          MOCK_OCR: "true"
        run: pytest tests/test_auth.py tests/test_dispatch.py tests/test_flags_vouchers.py tests/test_ledger.py tests/test_requests.py -v
