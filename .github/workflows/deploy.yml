name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify VITE_API_URL is configured
        run: |
          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "::warning::VITE_API_URL secret is not set."
            echo "::warning::The GitHub Pages build will use localhost fallback."
            echo "::warning::Remote users will see 'backend unreachable' banner."
            echo "::warning::Set it in Settings > Secrets and variables > Actions."
          else
            echo "VITE_API_URL is configured"
          fi
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
